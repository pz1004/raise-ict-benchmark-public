experiment_id: tier_p_cicids2017_day_holdout
profile_repeats: 2
test_size: 0.3
split_id: cicids2017_friday_holdout
datasets:
  - dataset_id: CICIDS2017
    data_root: data/raw/cicids2017/machine_learning
    max_rows_per_file: 30000
    split_strategy: day_holdout
    holdout_days:
      - friday
    split_id: cicids2017_friday_holdout_sample
models:
  - model_id: logistic_regression
  - model_id: random_forest
  - model_id: extra_trees
threats:
  - threat_id: a0_clean
    epsilon: 0.0
    mutable_features: []
    nonnegative_features: []
  - threat_id: a1_constrained_feature
    epsilon: 0.12
    strategy: random
    mutable_features:
      - flow_duration
      - total_fwd_packets
      - total_backward_packets
      - total_length_of_fwd_packets
      - total_length_of_bwd_packets
      - flow_bytes_s
      - flow_packets_s
      - flow_iat_mean
      - flow_iat_std
      - fwd_iat_total
      - bwd_iat_total
      - fwd_packets_s
      - bwd_packets_s
      - average_packet_size
    nonnegative_features:
      - flow_duration
      - total_fwd_packets
      - total_backward_packets
      - total_length_of_fwd_packets
      - total_length_of_bwd_packets
      - flow_bytes_s
      - flow_packets_s
      - flow_iat_mean
      - flow_iat_std
      - fwd_iat_total
      - bwd_iat_total
      - fwd_packets_s
      - bwd_packets_s
      - average_packet_size
  - threat_id: a1_constrained_score_search
    epsilon: 0.12
    strategy: score_search
    n_candidates: 6
    mutable_features:
      - flow_duration
      - total_fwd_packets
      - total_backward_packets
      - total_length_of_fwd_packets
      - total_length_of_bwd_packets
      - flow_bytes_s
      - flow_packets_s
      - flow_iat_mean
      - flow_iat_std
      - fwd_iat_total
      - bwd_iat_total
      - fwd_packets_s
      - bwd_packets_s
      - average_packet_size
    nonnegative_features:
      - flow_duration
      - total_fwd_packets
      - total_backward_packets
      - total_length_of_fwd_packets
      - total_length_of_bwd_packets
      - flow_bytes_s
      - flow_packets_s
      - flow_iat_mean
      - flow_iat_std
      - fwd_iat_total
      - bwd_iat_total
      - fwd_packets_s
      - bwd_packets_s
      - average_packet_size
  - threat_id: a4_split_shift
    epsilon: 0.0
    mutable_features: []
    nonnegative_features: []
seeds: [0, 1, 2, 3, 4]
hardware:
  hardware_id: cpu_proxy
preprocessing:
  categorical_columns: []
  drop_columns:
    - id
    - dataset_id
    - split
    - timestamp
    - src_ip
    - dst_ip
    - src_ip_dec
    - dst_ip_dec
    - source_ip
    - destination_ip
    - src_port
    - dst_port
    - source_port
    - destination_port
    - attack_cat
    - type
    - attack_type
    - day
    - scenario
    - group
  log_columns:
    - flow_duration
    - total_fwd_packets
    - total_backward_packets
    - total_length_of_fwd_packets
    - total_length_of_bwd_packets
    - flow_bytes_s
    - flow_packets_s
    - flow_iat_mean
    - flow_iat_std
    - flow_iat_max
    - flow_iat_min
    - fwd_iat_total
    - fwd_iat_mean
    - fwd_iat_std
    - fwd_iat_max
    - fwd_iat_min
    - bwd_iat_total
    - bwd_iat_mean
    - bwd_iat_std
    - bwd_iat_max
    - bwd_iat_min
    - fwd_packets_s
    - bwd_packets_s
    - average_packet_size
